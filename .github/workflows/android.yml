name: Build Android APK

# Builds a debug APK on every push to main (or a v* tag), or manually.
# The APK loads your hosted web app from APP_URL, so make sure the app is
# deployed first (e.g. on Vercel). Set APP_URL in repo Settings >
# Secrets and variables > Actions > Variables, or pass it on manual run.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Deployed app URL the APK should load'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to attach the APK to GitHub Releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Resolve APP_URL
        id: appurl
        run: |
          URL="${{ github.event.inputs.app_url || vars.APP_URL || secrets.APP_URL || 'https://mailer.leafsolar.ng' }}"
          echo "value=$URL" >> "$GITHUB_OUTPUT"
          echo "APP_URL=$URL"

      - name: Bake APP_URL into APK shell
        run: node scripts/bake-app-url.mjs
        env:
          APP_URL: ${{ steps.appurl.outputs.value }}

      - name: Add Android platform (Capacitor)
        run: |
          npm install @capacitor/android
          npx cap add android || echo "Android platform already exists"
        env:
          APP_URL: ${{ steps.appurl.outputs.value }}

      - name: Sync web shell into Android project
        run: npx cap sync android
        env:
          APP_URL: ${{ steps.appurl.outputs.value }}

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leafsolar-mailer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # On version tags (v1.1.0 etc.) attach the APK to the GitHub Release.
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
