name: Build Android APK

# Builds a debug APK automatically on every push to main, or manually.
# The APK wraps your hosted web app (set APP_URL below / in repo secrets).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Deployed app URL the APK should load'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_PATH: /tmp/leafsolar.db

      - name: Set APP_URL
        run: |
          URL="${{ github.event.inputs.app_url || vars.APP_URL || secrets.APP_URL || 'https://leafsolar-mailer.vercel.app' }}"
          echo "APP_URL=$URL" >> $GITHUB_ENV
          echo "Using APP_URL=$URL"

      - name: Add Android platform (Capacitor)
        run: |
          npm install @capacitor/android
          npx cap add android || echo "Android platform already exists"
          npx cap sync android
        env:
          APP_URL: ${{ env.APP_URL }}

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leafsolar-mailer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
