<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Leaf Solar Mailer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #16a34a 0%, #14532d 100%);
      color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .card { max-width: 360px; }
    .sun {
      width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 24px;
      background: radial-gradient(circle at 35% 35%, #fde68a, #f59e0b);
      box-shadow: 0 0 60px rgba(251, 191, 36, 0.6);
    }
    h1 { font-size: 26px; margin-bottom: 8px; }
    p { color: #d1fae5; line-height: 1.6; margin-bottom: 20px; }
    .spinner {
      width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { display: none; margin-top: 20px; }
    .err a { color: #fde68a; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <div class="sun"></div>
    <h1>Leaf Solar Mailer</h1>
    <p>Connecting to your dashboard…</p>
    <div class="spinner"></div>
    <p class="err" id="err">
      Couldn't reach the server. Make sure you're online and the app is deployed.<br />
      <a id="link" href="#">Retry</a>
    </p>
  </div>
  <script>
    // This page is only the offline/loading shell. The APK loads the live app
    // via capacitor.config.ts server.url. If it fails to load, show a retry.
    var APP_URL = window.LEAFSOLAR_URL || '';
    setTimeout(function () {
      var err = document.getElementById('err');
      var link = document.getElementById('link');
      if (APP_URL) link.href = APP_URL;
      err.style.display = 'block';
    }, 8000);
  </script>
</body>
</html>
