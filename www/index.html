<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Leaf Solar Mailer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #16a34a 0%, #14532d 100%);
      color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; text-align: center;
    }
    .sun {
      width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 20px;
      background: radial-gradient(circle at 35% 35%, #fde68a, #f59e0b);
      box-shadow: 0 0 60px rgba(251, 191, 36, 0.6);
    }
    h1 { font-size: 24px; margin-bottom: 6px; }
    .sub { color: #d1fae5; font-size: 14px; }
    .spinner {
      width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 18px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- This page is only the static fallback bundled with the APK. In normal
       operation the app loads the hosted site directly via capacitor
       server.url, so this is rarely seen. -->
  <div>
    <div class="sun"></div>
    <h1>Leaf Solar Mailer</h1>
    <p class="sub">Loading your dashboard…</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
