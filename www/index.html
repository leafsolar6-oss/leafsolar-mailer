<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Leaf Solar Mailer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #16a34a 0%, #14532d 100%);
      color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; text-align: center;
    }
    .card { max-width: 380px; width: 100%; }
    .sun {
      width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 20px;
      background: radial-gradient(circle at 35% 35%, #fde68a, #f59e0b);
      box-shadow: 0 0 60px rgba(251, 191, 36, 0.6);
    }
    h1 { font-size: 24px; margin-bottom: 6px; letter-spacing: -0.02em; }
    .sub { color: #d1fae5; font-size: 14px; margin-bottom: 22px; }
    .spinner {
      width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 6px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { display: none; }
    .err .box {
      background: rgba(0,0,0,0.22); border-radius: 16px; padding: 20px 16px; margin-top: 6px;
    }
    .err h2 { font-size: 17px; margin-bottom: 8px; }
    .err p { font-size: 13.5px; color: #d1fae5; line-height: 1.6; margin-bottom: 6px; }
    .err .hint { font-size: 12px; color: #bbf7d0; text-align: left; margin: 12px 2px; }
    .err .hint li { margin: 4px 0 4px 16px; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn {
      flex: 1; display: inline-block; background: #fff; color: #14532d; font-weight: 700;
      padding: 13px 10px; border-radius: 12px; text-decoration: none; font-size: 14px;
      border: none; cursor: pointer;
    }
    .btn.ghost { background: transparent; color: #fde68a; border: 1px solid rgba(253,230,138,0.5); }
    .foot { margin-top: 18px; font-size: 12px; color: #a7f3d0; word-break: break-all; }
    .foot a { color: #fde68a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="sun"></div>
    <h1>Leaf Solar Mailer</h1>
    <p class="sub" id="status">Connecting to your dashboard…</p>
    <div class="spinner" id="spinner"></div>

    <div class="err" id="err">
      <div class="box">
        <h2>Can't reach the app</h2>
        <p id="errmsg">Your phone couldn't connect to the server.</p>
        <ul class="hint" id="hints"></ul>
        <div class="btn-row">
          <button class="btn" id="retry">Retry</button>
          <a class="btn ghost" id="browser" href="#">Open in browser</a>
        </div>
      </div>
      <p class="foot" id="foot"></p>
    </div>
  </div>

  <script>
    // This shell is bundled INSIDE the APK. It probes the hosted app, then
    // navigates the WebView to it (allowed via capacitor allowNavigation).
    // It tries multiple hosts and uses the first that responds, so a blocked
    // DNS entry for one host doesn't break the app. https://mailer.leafsolar.ng is replaced
    // at build time by scripts/bake-app-url.mjs.
    var PRIMARY = '__APP_URL__';
    var HOSTS = [PRIMARY, 'https://leafsolar-mailer.vercel.app'];
    var TRIES = 0;

    var hints = [
      'Check your phone\u2019s Date & Time is set to Automatic (Settings \u2192 Date & time). A wrong clock blocks secure connections.',
      'Try switching between WiFi and mobile data.',
      'Update \u201cAndroid System WebView\u201d in the Play Store.',
      'If you\u2019re still stuck, tap "Open in browser" below.',
    ];

    function showErr(msg, bestHost) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').textContent = 'Connection problem';
      document.getElementById('errmsg').textContent = msg || 'Your phone couldn\u2019t connect to the server.';
      var browser = document.getElementById('browser');
      browser.href = bestHost || PRIMARY;
      var ul = document.getElementById('hints');
      ul.innerHTML = '';
      hints.forEach(function (h) { var li = document.createElement('li'); li.textContent = h; ul.appendChild(li); });
      document.getElementById('foot').innerHTML =
        'Server: <a href="' + (bestHost || PRIMARY) + '">' + (bestHost || PRIMARY) + '</a>';
      document.getElementById('err').style.display = 'block';
    }

    function probe(host) {
      return fetch(host + '/api/auth/status', {
        mode: 'no-cors',
        signal: AbortSignal.timeout(7000)
      }).then(function () { return true; }).catch(function () { return false; });
    }

    async function connect() {
      TRIES++;
      document.getElementById('err').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('status').textContent = 'Connecting to your dashboard…';

      if (navigator.onLine === false) {
        showErr('You appear to be offline. Turn on mobile data or WiFi and try again.');
        return;
      }

      // Try each host in order; navigate to the first that responds.
      for (var i = 0; i < HOSTS.length; i++) {
        var host = HOSTS[i];
        var ok = await probe(host);
        if (!ok && TRIES < 2) ok = await probe(host);
        if (ok) {
          window.location.replace(host);
          return;
        }
      }

      if (navigator.onLine === false) {
        showErr('You appear to be offline. Turn on mobile data or WiFi and try again.');
        return;
      }
      showErr('The server didn\u2019t respond from your phone.', PRIMARY);
    }

    document.getElementById('retry').addEventListener('click', connect);
    window.addEventListener('online', connect);
    connect();
  </script>
</body>
</html>
