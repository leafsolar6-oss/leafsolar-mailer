<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Leaf Solar Mailer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #16a34a 0%, #14532d 100%);
      color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .card { max-width: 380px; }
    .sun {
      width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 24px;
      background: radial-gradient(circle at 35% 35%, #fde68a, #f59e0b);
      box-shadow: 0 0 60px rgba(251, 191, 36, 0.6);
    }
    h1 { font-size: 26px; margin-bottom: 8px; }
    p { color: #d1fae5; line-height: 1.6; margin-bottom: 20px; font-size: 15px; }
    .spinner {
      width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { display: none; }
    .err .box {
      background: rgba(0,0,0,0.18); border-radius: 16px; padding: 18px 16px; margin-top: 4px;
    }
    .err h2 { font-size: 17px; margin-bottom: 8px; }
    .err p { font-size: 13.5px; margin-bottom: 14px; }
    .btn {
      display: inline-block; background: #fff; color: #14532d; font-weight: 700;
      padding: 12px 22px; border-radius: 12px; text-decoration: none; font-size: 14px;
      border: none; cursor: pointer;
    }
    .btn.ghost { background: transparent; color: #fde68a; border: 1px solid rgba(253,230,138,0.5); margin-left: 8px; }
    .hint { margin-top: 16px; font-size: 12px; color: #a7f3d0; }
    .hint a { color: #fde68a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="sun"></div>
    <h1>Leaf Solar Mailer</h1>
    <p id="status">Connecting to your dashboard…</p>
    <div class="spinner" id="spinner"></div>

    <div class="err" id="err">
      <div class="box">
        <h2>Couldn't reach the app</h2>
        <p id="errmsg">Make sure you're connected to the internet, then try again.</p>
        <button class="btn" id="retry">Retry</button>
        <a class="btn ghost" id="browser" href="#">Open in browser</a>
      </div>
      <p class="hint" id="hint"></p>
    </div>
  </div>

  <script>
    // This shell is bundled INSIDE the APK. It probes the live app and then
    // navigates the WebView to it, so failures show a helpful message instead
    // of a blank screen. https://mailer.leafsolar.ng is replaced at build time.
    var APP_URL = '__APP_URL__';
    var TRIES = 0;

    function showErr(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').textContent = 'Connection problem';
      document.getElementById('errmsg').textContent = msg || 'Make sure you are online and try again.';
      document.getElementById('browser').href = APP_URL;
      document.getElementById('hint').innerHTML =
        'If this keeps failing, open <a href="' + APP_URL + '">' + APP_URL + '</a> in your browser.';
      document.getElementById('err').style.display = 'block';
    }

    function go() {
      window.location.replace(APP_URL);
    }

    // Probe with no-cors: resolves when the server is reachable (any HTTP
    // status), rejects on network/DNS/TLS failure — no CORS headers needed.
    function probe() {
      return fetch(APP_URL + '/api/auth/status', {
        mode: 'no-cors',
        signal: AbortSignal.timeout(8000)
      }).then(function () { return true; }).catch(function () { return false; });
    }

    async function connect() {
      TRIES++;
      document.getElementById('err').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('status').textContent = 'Connecting to your dashboard…';

      if (navigator.onLine === false) {
        showErr('You appear to be offline. Connect to the internet and try again.');
        return;
      }
      var ok = await probe();
      if (ok) { go(); return; }
      if (navigator.onLine === false) {
        showErr('You appear to be offline. Connect to the internet and try again.');
        return;
      }
      showErr(TRIES > 1
        ? 'Still can\u2019t reach the server. Check your connection, or open the app in your browser.'
        : 'The server didn\u2019t respond. Try again in a moment.');
    }

    document.getElementById('retry').addEventListener('click', connect);
    window.addEventListener('online', connect);
    connect();
  </script>
</body>
</html>
